<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PDF Image Extractor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <nav><a href="/index.html">Upload</a><a href="/jobs.html">Past jobs</a></nav>
    <h1>Upload a PDF</h1>
    <form id="upload-form">
      <input type="file" name="pdf" accept="application/pdf" required />
      <label><input type="checkbox" name="webp" /> Convert to WebP</label>
      <button type="submit">Extract images</button>
    </form>
    <div id="progress" hidden>
      <p id="progress-text"></p>
      <button id="cancel-button">Cancel</button>
    </div>
    <p id="error-text"></p>
    <script type="module" src="/dist/upload.js"></script>
  </body>
</html>
