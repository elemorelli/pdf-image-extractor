<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jobs - PDF Image Extractor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="/index.html" class="app-name">PDF Image Extractor</a>
      <nav>
        <a href="/jobs.html" class="active" aria-current="page">Jobs</a>
      </nav>
    </header>
    <div class="page-header">
      <h1>Jobs</h1>
      <div class="jobs-toolbar">
        <label for="status-filter">Filter</label>
        <select id="status-filter">
          <option value="all">All</option>
          <option value="done">Done</option>
          <option value="error">Error</option>
          <option value="processing">Running</option>
        </select>
      </div>
    </div>
    <table id="jobs-table">
      <thead>
        <tr>
          <th data-sort="originalName">File</th>
          <th data-sort="uploadedAt">Processed</th>
          <th data-sort="status">Status</th>
          <th data-sort="images" class="col-center">Images</th>
          <th data-sort="size" class="col-center">Size</th>
          <th></th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
    <script type="module" src="/dist/jobs.js"></script>
  </body>
</html>
