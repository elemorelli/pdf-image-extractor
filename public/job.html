<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job detail - PDF Image Extractor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="/index.html" class="app-name">PDF Image Extractor</a>
      <nav>
        <a href="/jobs.html" class="active" aria-current="page">Jobs</a>
      </nav>
    </header>
    <h1 id="job-title"></h1>
    <div id="job-toolbar" class="job-toolbar"></div>
    <details id="transparent-section" class="section" open>
      <summary>
        <input
          type="checkbox"
          id="transparent-select-all"
          class="section-select-all"
          aria-label="Select all transparent images"
        />
        <span class="section-icon"></span>
        Transparent
      </summary>
      <div id="transparent-grid" class="grid"></div>
    </details>
    <details id="opaque-section" class="section" open>
      <summary>
        <input
          type="checkbox"
          id="opaque-select-all"
          class="section-select-all"
          aria-label="Select all opaque images"
        />
        <span class="section-icon"></span>
        Opaque
      </summary>
      <div id="opaque-grid" class="grid"></div>
    </details>
    <div id="lightbox" class="lightbox" hidden>
      <button id="lightbox-close" class="btn btn-icon lightbox-close" aria-label="Close"></button>
      <button
        id="lightbox-prev"
        class="btn btn-icon lightbox-nav lightbox-prev"
        aria-label="Previous"
      ></button>
      <figure class="lightbox-figure">
        <img id="lightbox-image" alt="" />
        <figcaption class="lightbox-info">
          <span id="lightbox-filename" class="lightbox-filename"></span>
          <span id="lightbox-meta" class="lightbox-meta-line"></span>
        </figcaption>
        <div class="lightbox-actions">
          <a id="lightbox-download" href="#" download class="btn btn-secondary">Download</a>
          <button id="lightbox-delete" class="btn btn-danger">Delete</button>
        </div>
      </figure>
      <button
        id="lightbox-next"
        class="btn btn-icon lightbox-nav lightbox-next"
        aria-label="Next"
      ></button>
    </div>
    <script type="module" src="/dist/job.js"></script>
  </body>
</html>
