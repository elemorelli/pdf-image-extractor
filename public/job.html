<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Job detail - PDF Image Extractor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="app-header">
      <a href="/index.html" class="app-name">PDF Image Extractor</a>
      <nav>
        <a href="/jobs.html" class="active" aria-current="page">Past jobs</a>
      </nav>
    </header>
    <h1 id="job-title"></h1>
    <div id="job-toolbar" class="job-toolbar"></div>
    <details class="section" open>
      <summary>Transparent</summary>
      <div id="transparent-grid" class="grid"></div>
    </details>
    <details class="section" open>
      <summary>Opaque</summary>
      <div id="opaque-grid" class="grid"></div>
    </details>
    <div id="lightbox" class="lightbox" hidden>
      <button id="lightbox-close" class="btn btn-icon lightbox-close" aria-label="Close">
        &times;
      </button>
      <button
        id="lightbox-prev"
        class="btn btn-icon lightbox-nav lightbox-prev"
        aria-label="Previous"
      >
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="15 6 9 12 15 18"></polyline>
        </svg>
      </button>
      <figure class="lightbox-figure">
        <img id="lightbox-image" alt="" />
        <figcaption class="lightbox-info">
          <span id="lightbox-filename" class="lightbox-filename"></span>
          <span id="lightbox-meta" class="lightbox-meta-line"></span>
        </figcaption>
        <div class="lightbox-actions">
          <a id="lightbox-download" href="#" download class="btn btn-secondary">Download</a>
          <button id="lightbox-delete" class="btn btn-danger">Delete</button>
        </div>
      </figure>
      <button id="lightbox-next" class="btn btn-icon lightbox-nav lightbox-next" aria-label="Next">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="9 6 15 12 9 18"></polyline>
        </svg>
      </button>
    </div>
    <script type="module" src="/dist/job.js"></script>
  </body>
</html>
