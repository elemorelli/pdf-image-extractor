services:
  pdf-image-extractor:
    build: .
    image: ghcr.io/elemorelli/pdf-image-extractor:latest
    ports:
      - '54217:3000'
    volumes:
      - data:/data
    restart: unless-stopped
    # environment:
    #   MAX_UPLOAD_MB: '200'    # max PDF upload size
    #   RETENTION_HOURS: '24'   # how long finished jobs are kept before cleanup

volumes:
  data:
